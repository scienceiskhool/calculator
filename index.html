<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scientific Calculator · Science is Khool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F2A2E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a faithful classroom tool, no decoration beyond the device itself
   IDEA: the physical SEAB-approved scientific calculators (fx-97SG CW, fx-97SG X, HP 10s+ layouts)
   PICTURE: the calculator body itself, scaled to fill the window
   COLOUR and TYPE: charcoal body, grey-green LCD, gold SHIFT / red ALPHA / blue Base-N legends
   LAYOUT: portrait body; switches to a side-by-side body when the window is wide and short */
:root{color-scheme:light dark;--bg:light-dark(#e9ebee,#121315)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#holder{position:relative}
#calc{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;gap:10px;padding:16px 18px 20px;width:400px;
  background:radial-gradient(120% 60% at 30% 0%,#3a3c41 0%,#26272b 45%,#1d1e21 100%);border-radius:28px;
  box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 2px #151618}
#calc.land{flex-direction:row;width:auto;gap:18px}
.top{display:flex;flex-direction:column;gap:8px;width:364px}
.keys{display:flex;flex-direction:column;gap:4px;width:364px}
.brand{display:flex;justify-content:space-between;align-items:baseline;color:#d9dadd;padding:0 4px;height:26px}
.brand b{font-weight:800;letter-spacing:.06em;font-size:15px}
.brand span{font-size:12px;color:#a9abb0;font-weight:600}
.bezel{background:#151618;border-radius:12px;padding:9px 10px 7px}
.lcd{height:172px;border-radius:5px;background:linear-gradient(180deg,#b9c4b1,#c9d3c0 30%,#c4cfba);box-shadow:inset 0 2px 5px rgba(0,0,0,.35);color:#1b2016;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:"Segoe UI",Arial,sans-serif}
.lcd.off>*{visibility:hidden}
.ind{height:16px;display:flex;gap:7px;padding:1px 6px 0;font-size:11px;font-weight:700;line-height:15px;white-space:nowrap;overflow:hidden}
.ind .sp{flex:1}
.body{flex:1;position:relative;overflow:hidden;padding:0 6px 4px;font-size:21px}
.lbl{text-align:center;color:#c25a63;font-size:10px;letter-spacing:.5em;margin-top:5px;font-weight:700}
/* calc screen */
.cs{display:flex;flex-direction:column;height:100%}
.inp{position:relative;flex:1;overflow:hidden;white-space:nowrap;display:flex;align-items:flex-start;padding-top:4px}
.inp .ln{display:inline-flex;align-items:center;white-space:nowrap;min-height:30px}
.out{text-align:right;font-size:27px;white-space:nowrap;overflow:hidden;min-height:38px;display:flex;justify-content:flex-end;align-items:flex-end;line-height:1.15}
.out.small{font-size:19px}
.out .multi{display:flex;flex-direction:column;align-items:flex-end;font-size:20px}
.bin{font-size:17px;letter-spacing:.06em;text-align:right;line-height:1.25}
.cur{display:inline-block;width:0;height:1.05em;border-left:2px solid #111;margin-right:-2px;vertical-align:middle;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.op{padding:0 .08em}
.ng{padding-right:.03em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.9em;line-height:1.05}
.fr>.nu{border-bottom:1.6px solid currentColor;padding:0 .15em .05em;display:inline-flex;align-items:center;min-width:.8em;justify-content:center}
.fr>.de{padding:.05em .15em 0;display:inline-flex;align-items:center;min-width:.8em;justify-content:center}
.sq{display:inline-flex;align-items:flex-end;margin:0 .05em}
.sq .rd{font-size:1.05em;line-height:1}
.sq .rc{border-top:1.6px solid currentColor;padding:.05em .1em 0;display:inline-flex;align-items:center;margin-left:-.05em}
.sq .ix{font-size:.55em;align-self:flex-start;margin-right:-.35em;display:inline-flex}
.ex{font-size:.66em;vertical-align:.75em;display:inline-flex;align-items:center;line-height:1}
.ab{display:inline-flex;align-items:center;border-left:1.6px solid;border-right:1.6px solid;padding:0 .15em;margin:0 .1em}
.slot{display:inline-flex;min-width:.55em;height:.82em;border:1px dashed #3d4637;vertical-align:middle;align-items:center}
i{font-style:italic;font-family:"Times New Roman",Times,serif;font-size:1.08em}
.pc{font-weight:700;padding:0 .05em}
/* menus, tables */
.menu{display:flex;flex-direction:column;height:100%;font-size:16px}
.mt{font-size:13px;font-weight:700;border-bottom:1px solid #4a5444;padding-bottom:1px;margin-bottom:2px}
.ml{position:relative;flex:1;overflow:hidden}
.mi{padding:1px 4px;line-height:1.35;white-space:nowrap}
.mi.on{background:#1b2016;color:#c9d3c0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:100%;padding-top:2px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;border:1.5px solid transparent;border-radius:4px;gap:2px}
.tile.on{background:#1b2016;color:#c9d3c0}
.tile .ic{font-size:15px;font-weight:700;height:20px;display:flex;align-items:center}
.pr{font-size:18px;margin-top:10px}
.err{display:flex;flex-direction:column;justify-content:center;height:100%;font-size:15px;gap:4px;padding-left:4px}
.err b{font-size:19px;margin-bottom:4px}
table.st{border-collapse:collapse;font-size:14px;width:100%;table-layout:fixed}
table.st th{font-weight:700;border-bottom:1px solid #4a5444;text-align:center;font-size:13px}
table.st td{text-align:right;padding:1px 4px;border-left:1px solid #8a9584;height:21px;overflow:hidden;white-space:nowrap}
table.st td.rn{border-left:0;text-align:left;width:26px;font-size:12px}
table.st td.sel{background:#1b2016;color:#c9d3c0}
.sted{display:flex;flex-direction:column;height:100%}
.sted .bot{border-top:1px solid #4a5444;height:34px;display:flex;align-items:center;justify-content:flex-end;white-space:nowrap;overflow:hidden;font-size:19px}
.tmpl{font-size:15px;text-align:center;padding-bottom:1px}
.list .row{display:flex;justify-content:space-between;font-size:17px;line-height:1.4;white-space:nowrap}
.sol{display:flex;flex-direction:column;height:100%}
.sol .k{font-size:18px}
.sol .v{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;font-size:26px;white-space:nowrap}
/* keys */
.ctrl{display:grid;grid-template-columns:56px 56px 1fr 56px 56px;grid-template-rows:56px 54px;align-items:end;column-gap:4px}
.dpad{grid-column:3;grid-row:1/3;justify-self:center;align-self:center;width:118px;height:108px;position:relative;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#45484d,#2a2c30 70%);box-shadow:0 3px 0 #0e0f10,inset 0 1px 0 rgba(255,255,255,.15)}
.dpad::after{content:"";position:absolute;left:50%;top:50%;width:40px;height:36px;transform:translate(-50%,-50%);border-radius:50%;background:#1f2023;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.dpad button{position:absolute;background:none;border:0;color:#e6e7ea;font-size:15px;cursor:pointer;width:38px;height:34px;padding:0}
.dpad .u{left:40px;top:0}.dpad .d{left:40px;bottom:0}.dpad .l{left:0;top:37px}.dpad .r{right:0;top:37px}
.dpad button:active{color:#f2b134}
.cell{display:flex;flex-direction:column;align-items:stretch}
.leg{height:14px;display:flex;justify-content:space-between;font-size:10px;font-weight:700;line-height:14px;padding:0 1px;white-space:nowrap}
.leg .s{color:#f2b134}.leg .a{color:#ff6f6f}.leg .b{color:#6fc6ff}
.leg.c{justify-content:center;gap:5px}
.row6{display:grid;grid-template-columns:repeat(6,1fr);column-gap:8px}
.row5{display:grid;grid-template-columns:repeat(5,1fr);column-gap:10px}
.key{height:30px;border:0;border-radius:8px;color:#f3f4f6;font:600 14px/1 "Segoe UI",Arial,sans-serif;cursor:pointer;
  background:linear-gradient(180deg,#4a4d53,#303237);box-shadow:0 3px 0 #0f1012,inset 0 1px 0 rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
.key:active,.key.pr{transform:translateY(2px);box-shadow:0 1px 0 #0f1012,inset 0 1px 0 rgba(255,255,255,.1)}
.key sup{font-size:.68em;vertical-align:.55em;line-height:0}
.key sub{font-size:.68em;line-height:0}
.key.n{height:42px;font-size:21px;font-weight:500;border-radius:9px;background:linear-gradient(180deg,#3e4146,#26282c)}
.key.y{background:linear-gradient(180deg,#f7bd45,#e39a1c);color:#1a1a1a;font-size:17px;font-weight:700}
.key.rnd{border-radius:16px;height:30px;font-size:11px;letter-spacing:.02em}
.key.sh.on{background:linear-gradient(180deg,#f7bd45,#d58f16);color:#1a1a1a}
.key.al.on{background:linear-gradient(180deg,#ff7b7b,#cc3e3e)}
.gap{height:6px}
.bx{display:inline-block;width:.5em;height:.62em;border:1.3px solid currentColor;vertical-align:-.05em;margin:0 .04em}
.fi{display:inline-flex;flex-direction:column;align-items:center;gap:1px;vertical-align:middle}
.fi b{width:8px;height:7px;border:1.3px solid currentColor}
.fi i{width:12px;border-top:1.6px solid currentColor;font-size:0}

/* layout bar */
body{display:flex;flex-direction:column}
#bar{display:flex;justify-content:center;gap:6px;padding:6px 8px 0;flex-wrap:wrap;flex:none}
#bar button{font:600 13px/1 "Segoe UI",Arial,sans-serif;padding:8px 14px;min-height:34px;border-radius:999px;border:1px solid light-dark(#c4c8ce,#3a3d42);background:light-dark(#fff,#1d1f22);color:light-dark(#222,#ddd);cursor:pointer}
#bar button.on{background:light-dark(#222,#eee);color:light-dark(#fff,#111);border-color:transparent}
#bar button:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
.leg .t{color:#e9eaec;font-size:10px;letter-spacing:.02em}
/* ---- fx-97SG CW ---- */
#calc.L-cw{background:linear-gradient(180deg,#232427,#161719);border-radius:36px;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 0 0 3px #0e0f10,inset 0 1px 0 rgba(255,255,255,.08)}
.L-cw .bezel{background:#1b1c1e;border:1px solid #303236}
.L-cw .lcd{background:linear-gradient(180deg,#cfd6d2,#dde3df);color:#111}
.L-cw .lbl{text-align:right;color:#d5d7da;letter-spacing:.4em}
.L-cw .leg{justify-content:flex-start;gap:4px}.L-cw .leg .s{color:#7fdb5c}.L-cw .leg.c{justify-content:center}
.L-cw .key{width:46px;height:46px;justify-self:center;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 35%,#eef0f1,#c8cbce 75%);color:#1a1b1d;box-shadow:0 3px 0 #0b0c0d,inset 0 -2px 3px rgba(0,0,0,.15);font-size:17px}
.L-cw .key.n{width:54px;height:54px;font-size:24px;font-weight:500}
.L-cw .key.fmt{font-size:8.5px;font-weight:800;letter-spacing:-.03em;overflow:hidden}
.L-cw .key.dk{background:radial-gradient(circle at 50% 35%,#45474b,#222326 75%);color:#e9eaec;width:44px;height:44px;font-size:18px}
.L-cw .key.knob{width:38px;height:38px}
.L-cw .key.grn{background:radial-gradient(circle at 50% 35%,#9cf07a,#5ec236 75%);color:#2c5c1b;font-size:22px}
.L-cw .key.grn.on{box-shadow:0 0 0 3px #e9eaec,0 3px 0 #0b0c0d}
.L-cw .key:active,.L-cw .key.pr{transform:translateY(2px);box-shadow:0 1px 0 #0b0c0d}
.L-cw .row6{column-gap:6px;margin-bottom:2px}.L-cw .row5{column-gap:8px;margin-bottom:2px}
.cwctrl{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:62px 58px 62px;align-items:end}
.cwpad{position:relative;align-self:center;justify-self:center;width:150px;height:118px}
.cwpad button{position:absolute;width:42px;height:42px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 35%,#46484c,#222326 75%);color:#ececee;font:700 17px/1 Arial,sans-serif;box-shadow:0 3px 0 #0b0c0d;cursor:pointer}
.cwpad::before{content:"";position:absolute;left:50%;top:50%;width:112px;height:26px;transform:translate(-50%,-50%);background:#0f1011;border-radius:13px}
.cwpad::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:104px;transform:translate(-50%,-50%);background:#0f1011;border-radius:13px}
.cwpad button{z-index:1}.cwpad .u{left:54px;top:0}.cwpad .d{left:54px;bottom:0}.cwpad .l{left:8px;top:38px}.cwpad .r{right:8px;top:38px}.cwpad .ok{left:54px;top:38px;font-size:14px}
.cwpad button:active{transform:translateY(2px)}
.pg{display:flex;flex-direction:column;justify-self:center;align-self:center;width:46px;height:104px;border-radius:23px;background:#222326;box-shadow:0 3px 0 #0b0c0d,inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden}
.pg button{flex:1;border:0;background:none;color:#ececee;font-size:20px;cursor:pointer}.pg button:active{background:#33353a}
.sliders{display:inline-flex;flex-direction:column;gap:3px}.sliders i{display:block;width:16px;height:2px;background:currentColor;font-size:0}
/* ---- HP 10s+ ---- */
#calc.L-hp{background:linear-gradient(180deg,#fdfdfe,#e4e7eb);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.25),inset 0 0 0 2px #c9ced5}
.L-hp .brand{color:#2a2d33;align-items:center}.L-hp .brand span{color:#3b4049;font-size:12px;font-weight:700}
.solar{display:block;width:150px;height:28px;background:linear-gradient(180deg,#4a3833,#1f1614);border-radius:3px;box-shadow:inset 0 0 0 2px #120c0b}
.hpname{font:700 14px/1 "Segoe UI",Arial,sans-serif;color:#2a2d33;padding-left:4px}
.L-hp .bezel{background:#d7dbe0;border:1px solid #b3b9c1}
.L-hp .lcd{background:linear-gradient(180deg,#c3c9bf,#d3d8ce);color:#16190f}
.L-hp .out{font-family:"Courier New",Courier,monospace;font-weight:700;font-size:31px;letter-spacing:.02em}
.L-hp .leg .s{color:#1f7fd0}.L-hp .leg .a{color:#e2701a}.L-hp .leg .b{color:#2e9a68}
.L-hp .key{background:linear-gradient(180deg,#d2dae4,#a3afbf);color:#18202c;border-radius:7px;box-shadow:0 3px 0 #6c7787,inset 0 1px 0 rgba(255,255,255,.6)}
.L-hp .key.n{background:linear-gradient(180deg,#3b3e43,#18191c);color:#fff;box-shadow:0 3px 0 #000}
.L-hp .key.sh.on{background:linear-gradient(180deg,#5aa9ea,#1f7fd0);color:#fff}
.L-hp .key.al.on{background:linear-gradient(180deg,#f5a056,#e2701a);color:#fff}
.L-hp .key:active,.L-hp .key.pr{box-shadow:0 1px 0 #6c7787}
.hpctrl{display:grid;grid-template-columns:repeat(4,1fr) 122px;grid-template-rows:50px 50px;column-gap:8px;align-items:end}
.L-hp .dpad{width:112px;height:100px;background:radial-gradient(circle at 50% 40%,#4b4e54,#1c1d20 70%)}
.L-hp .dpad::after{background:#2c2e32}
.L-hp .dpad .u{left:37px}.L-hp .dpad .d{left:37px}.L-hp .dpad .l{top:33px}.L-hp .dpad .r{top:33px}

/* fixed real-device proportions (width : height) */
#calc{height:860px}
#calc.L-x,#calc.L-cw{height:860px}
#calc.L-hp{height:763px}
#calc .keys{flex:1;justify-content:space-evenly}
.L-cw .lcd{height:150px}
.L-cw .cwctrl{grid-template-rows:56px 52px 56px}
.L-cw .key{width:44px;height:44px}
.L-cw .key.n{width:50px;height:50px;font-size:23px}
.L-cw .key.dk{width:42px;height:42px}
.L-cw .row6,.L-cw .row5{margin-bottom:0}
.L-hp .lcd{height:150px}
.hpctrl{grid-template-rows:46px 46px}
.L-cw .key.n.fmt{font-size:9px;font-weight:800;letter-spacing:-.02em;flex-direction:column;gap:1px;line-height:1}
.L-cw .key.fmt .arc{font-size:11px;line-height:.6;font-weight:400}
/* ---- PDF workspace ---- */
#main{flex:1;display:flex;min-height:0}
#stage{position:relative;inset:auto;flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#ws{display:none;flex:1;min-width:0;flex-direction:column;background:light-dark(#d4d8de,#16171a);border-right:1px solid light-dark(#c2c7ce,#2a2c30)}
body.ws #ws{display:flex}
body.ws.nocalc #stage{display:none}
body.ws #stage{flex:0 0 auto}
.pdfbtn{margin-left:10px}
#bar .pdfbtn{background:light-dark(#1f6feb,#2f81f7);color:#fff;border-color:transparent}
@media (max-width:699px){#bar .pdfbtn{display:none}}
#tb{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 8px;background:light-dark(#f7f8fa,#1f2023);border-bottom:1px solid light-dark(#d5d9df,#2c2e33)}
#tb .grp{display:flex;gap:3px;align-items:center}
#tb .flex{flex:1}
#tb button{height:40px;min-width:40px;padding:0 8px;border:1px solid transparent;border-radius:9px;background:none;color:light-dark(#222,#e6e6e6);display:inline-flex;align-items:center;gap:6px;font:600 13px/1 "Segoe UI",Arial,sans-serif;cursor:pointer}
#tb button:hover{background:light-dark(#e8ebef,#2b2d31)}
#tb button.on,#tb button[aria-pressed=true]{background:light-dark(#dbe7fb,#203a5c);border-color:light-dark(#9fc0f2,#3b6fb3)}
#tb button:focus-visible{outline:2px solid #3b82f6;outline-offset:1px}
#tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tb button.primary{background:light-dark(#1f6feb,#2f81f7);color:#fff}
#tb button.primary:hover{background:light-dark(#1a5fd0,#4b93f8)}
#tb .zl{min-width:58px;justify-content:center}
#tb .sw{width:40px;padding:0;justify-content:center}
#tb .sw i{display:block;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#tb .wd{width:40px;padding:0;justify-content:center}
#tb .wd i{display:block;border-radius:50%;background:currentColor}
#pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding:14px 12px 40px;position:relative;overscroll-behavior:contain}
#pages.fingerdraw{touch-action:none}
.page{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.12);-webkit-user-select:none;user-select:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page .pno{position:absolute;right:-2px;bottom:-18px;font:12px "Segoe UI",Arial,sans-serif;color:light-dark(#555,#999)}
.page .txt{position:absolute;inset:0;pointer-events:none}
#pages.tool-pen .page,#pages.tool-hl .page{cursor:crosshair}
#pages.tool-eraser .page{cursor:cell}
#pages.tool-text .page{cursor:text}
#pages.tool-hand .page{cursor:grab}
.tbx{position:absolute;pointer-events:auto;font-family:Helvetica,Arial,sans-serif;line-height:1.25}
.tbx .ed{padding:.15em .25em;min-width:2em;min-height:1.25em;white-space:pre;outline:none;border:1px dashed transparent;border-radius:2px;-webkit-user-select:text;user-select:text;cursor:text}
.tbx:hover .ed,.tbx:focus-within .ed{border-color:#3b82f6;background:rgba(255,255,255,.6)}
.tbx .grip,.tbx .del{position:absolute;top:-22px;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;font:14px/1 Arial,sans-serif;border:0;color:#fff;cursor:pointer;touch-action:none}
.tbx .grip{left:-4px;background:#3b82f6;cursor:move}
.tbx .grip::before{content:"✥";font-size:13px}
.tbx .del{left:22px;background:#dc2626}
.tbx:focus-within .grip,.tbx:focus-within .del,.tbx.drag .grip{display:flex}
#pdfmsg{position:absolute;inset:auto 0 0 0}
#drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(31,111,235,.15);border:3px dashed #1f6feb;font:600 20px "Segoe UI",Arial,sans-serif;color:#1f6feb;z-index:30;pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font:14px "Segoe UI",Arial,sans-serif;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw}
#toast.show{opacity:1}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
#dlg[hidden]{display:none}
#dlg .box{background:light-dark(#fff,#222);color:light-dark(#222,#eee);padding:20px;border-radius:14px;max-width:360px;font:15px/1.45 "Segoe UI",Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#dlg button{min-height:40px;padding:0 14px;border-radius:9px;border:1px solid light-dark(#ccc,#444);background:none;color:inherit;font:600 14px "Segoe UI",Arial,sans-serif;cursor:pointer}
#dlg button.danger{background:#dc2626;color:#fff;border-color:transparent}
.loading{display:flex;align-items:center;justify-content:center;height:100%;font:15px "Segoe UI",Arial,sans-serif;color:light-dark(#444,#bbb)}

#ws{position:relative}

#fab{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:#1f6feb;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;transition:transform .15s,background .15s}
#fab:hover{background:#1a5fd0}#fab:active{transform:scale(.94)}
#fab:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
#fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fab .ic-min{display:none}
body.ws:not(.nocalc) #fab{background:#374151}
body.ws:not(.nocalc) #fab .ic-calc{display:none}body.ws:not(.nocalc) #fab .ic-min{display:block}
@media (prefers-reduced-motion:reduce){#fab{transition:none}}

/* Science is Khool header + footer */
.topbar{flex:none;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-left));background:light-dark(#fff,#1b1c1f);border-bottom:1px solid light-dark(#E4E8E9,#2c2e33)}
.topbar .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:light-dark(#1F2A2E,#f1f1f1);font:800 1.15rem/1.2 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;white-space:nowrap;margin-right:auto}
.topbar .brand span{color:inherit;font:inherit;padding:0}
.topbar .brand img{width:40px;height:40px;border-radius:50%;background:#FCE883;border:2.5px solid #1F2A2E;object-fit:cover}
.topbar .brand:focus-visible{outline:3px solid #FCE883;outline-offset:3px;border-radius:24px}
.topbar #bar{padding:0;justify-content:flex-end}
.site-foot{flex:none;text-align:center;font:13px/1.4 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:light-dark(#56656A,#9aa3a6);padding:6px 16px 10px}
.site-foot a{color:light-dark(#057A7A,#5fd0d0);font-weight:700}
body.ws.nocalc .topbar,body.ws .site-foot{display:none}
@media (max-width:560px){.topbar{justify-content:center}.topbar .brand{margin:0 auto}.topbar #bar{justify-content:center}}
</style>

/* ================= settings & memory ================= */
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v?Object.assign({},d,v):{...d}}catch(e){return {...d}}};
const DEF_SETUP={io:0,angle:'D',fmt:'Norm',fmtN:1,frac:'dc',freq:false};

/* ================= errors & helpers ================= */
class CE{constructor(t){this.t=t}}
const err=t=>{throw new CE(t)};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const tidy=v=>Math.abs(v)<1e-13?0:+v.toPrecision(14);
const toRad=x=>setup.angle==='D'?x*Math.PI/180:setup.angle==='G'?x*Math.PI/200:x;
const fromRad=x=>setup.angle==='D'?x*180/Math.PI:setup.angle==='G'?x*200/Math.PI:x;
function ratApprox(x,maxDen,tol){
  if(!isFinite(x))return null;const sg=x<0?-1:1;x=Math.abs(x);tol=tol??5e-14*Math.max(1,x);
  let p0=0,q0=1,p1=1,q1=0,b=x;
  for(let i=0;i<40;i++){const a=Math.floor(b),p2=a*p1+p0,q2=a*q1+q0;if(q2>maxDen)return null;
    if(Math.abs(x-p2/q2)<=tol)return{n:sg*p2,d:q2};p0=p1;q0=q1;p1=p2;q1=q2;const f=b-a;if(f<1e-15)return null;b=1/f}
  return null}
function fact(n){if(!Number.isInteger(n)||n<0||n>69)err('Math');let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function nPr(n,r){if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<r||n>=1e10)err('Math');let v=1;for(let i=0;i<r;i++){v*=n-i;if(!isFinite(v))err('Math')}return v}
function nCr(n,r){if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<r||n>=1e10)err('Math');r=Math.min(r,n-r);let v=1;for(let i=1;i<=r;i++){v=v*(n-r+i)/i;if(!isFinite(v))err('Math')}return Math.round(v)}
function powf(a,b){if(a===0&&b<=0)err('Math');if(a<0&&!Number.isInteger(b)){const r=ratApprox(b,1000);if(r&&r.d%2===1){const v=Math.pow(-a,b);return tidy(r.n%2===0?v:-v)}err('Math')}const v=Math.pow(a,b);if(!isFinite(v))err('Math');return Number.isInteger(b)?v:tidy(v)}
function rootf(n,a){if(n===0)err('Math');if(a<0){if(Number.isInteger(n)&&Math.abs(n)%2===1)return -tidy(Math.pow(-a,1/n));err('Math')}return tidy(Math.pow(a,1/n))}
function tanCheck(x){const q=setup.angle==='D'?90:setup.angle==='G'?100:Math.PI/2,k=x/q,r=Math.round(k);if(Math.abs(k-r)<1e-12&&r%2!==0)err('Math')}
const toBase32=v=>{v=Math.trunc(v);if(v>2147483647||v<-2147483648)err('Math');return v};

/* ================= function application ================= */
function applyFn(f,A,c){
  const one=()=>{if(A.length!==1)err('Argument');return A[0]};
  const two=()=>{if(A.length!==2)err('Argument');return A};
  let x,y;
  switch(f){
    case 'sin':x=one();if(Math.abs(x)>=1e10)err('Math');return tidy(Math.sin(toRad(x)));
    case 'cos':x=one();if(Math.abs(x)>=1e10)err('Math');return tidy(Math.cos(toRad(x)));
    case 'tan':x=one();if(Math.abs(x)>=1e10)err('Math');tanCheck(x);return tidy(Math.tan(toRad(x)));
    case 'asin':x=one();if(x<-1||x>1)err('Math');c.inv=1;return tidy(fromRad(Math.asin(x)));
    case 'acos':x=one();if(x<-1||x>1)err('Math');c.inv=1;return tidy(fromRad(Math.acos(x)));
    case 'atan':x=one();c.inv=1;return tidy(fromRad(Math.atan(x)));
    case 'sinh':return tidy(Math.sinh(one()));case 'cosh':return tidy(Math.cosh(one()));case 'tanh':return tidy(Math.tanh(one()));
    case 'asinh':return tidy(Math.asinh(one()));
    case 'acosh':x=one();if(x<1)err('Math');return tidy(Math.acosh(x));
    case 'atanh':x=one();if(x<=-1||x>=1)err('Math');return tidy(Math.atanh(x));
    case 'log':if(A.length===2){[x,y]=A;if(x<=0||x===1||y<=0)err('Math');return tidy(Math.log(y)/Math.log(x))}x=one();if(x<=0)err('Math');return tidy(Math.log10(x));
    case 'ln':x=one();if(x<=0)err('Math');return tidy(Math.log(x));
    case 'sqrt':x=one();if(x<0)err('Math');c.surd=1;return Math.sqrt(x);
    case 'cbrt':c.surd=1;return Math.cbrt(one());
    case 'abs':return Math.abs(one());
    case 'pol':{[x,y]=two();if(x===0&&y===0)err('Math');const r=Math.hypot(x,y),t=tidy(fromRad(Math.atan2(y,x)));vars.x=r;vars.y=t;c.multi=[['r',r],['θ',t]];return r}
    case 'rec':{[x,y]=two();const a=tidy(x*Math.cos(toRad(y))),b=tidy(x*Math.sin(toRad(y)));vars.x=a;vars.y=b;c.multi=[['x',a],['y',b]];return a}
    case 'gcd':case 'lcm':{[x,y]=two();if(!Number.isInteger(x)||!Number.isInteger(y)||x===0&&y===0)err('Math');const g=gcd(x,y);return f==='gcd'?g:Math.abs(x*y)/g}
    case 'int':return Math.trunc(one());
    case 'intg':return Math.floor(one());
    case 'rnd':{x=one();const f2=fmtNum(x);return parseFloat(f2.m.replace(/,/g,'')+(f2.e!==null?'e'+f2.e:''))}
    case 'ranint':{[x,y]=two();if(!Number.isInteger(x)||!Number.isInteger(y)||x>y)err('Math');return x+Math.floor(Math.random()*(y-x+1))}
    case 'not':return toBase32(~one());
    case 'bneg':return toBase32(-one());
  }
  err('Syntax');
}
function bitop(o,a,b){a|=0;b|=0;switch(o){case 'and':return a&b;case 'or':return a|b;case 'xor':return a^b;case 'xnor':return ~(a^b)}}

/* ================= parser (Casio priority order) ================= */
const PRIMS=new Set(['d','E','hex','var','ans','const','lp','fn','ran','svar','neg','frac','mixed','sqrt','cbrt','root','tenpow','epow','abs']);
function evaluate(arr,ctx){const p=new P(arr,ctx);const v=p.expr();if(p.i<arr.length)err('Syntax');if(!isFinite(v)||Math.abs(v)>=1e100)err('Math');return v}
class P{
  constructor(t,c){this.t=t;this.i=0;this.c=c}
  pk(){return this.t[this.i]}
  is(k,v){const t=this.t[this.i];return t&&t.k===k&&(v===undefined||t.v===v)}
  fix(v){if(this.c.base)return toBase32(v);if(!isFinite(v)||Math.abs(v)>=1e100)err('Math');return v}
  expr(){if(!this.c.base)return this.add();let l=this.add();while(this.is('lop')){const o=this.t[this.i++].v;l=bitop(o,l,this.add())}return l}
  add(){let l=this.mul();for(;;){if(this.is('op','+')){this.i++;l=this.fix(l+this.mul())}else if(this.is('op','−')){this.i++;l=this.fix(l-this.mul())}else return l}}
  mul(){let l=this.perm();for(;;){if(this.is('op','×')){this.i++;l=this.fix(l*this.perm())}else if(this.is('op','÷')){this.i++;const r=this.perm();if(r===0)err('Math');l=this.fix(this.c.base?Math.trunc(l/r):l/r)}else return l}}
  perm(){let l=this.impl();while(this.is('npr')||this.is('ncr')){const k=this.t[this.i++].k,r=this.impl();l=k==='npr'?nPr(l,r):nCr(l,r)}return l}
  impl(){let v=this.unary();while(!this.c.base&&this.pk()&&PRIMS.has(this.pk().k))v=this.fix(v*this.unary());return v}
  unary(){if(this.is('neg')||this.is('op','−')){this.i++;return -this.unary()}if(this.is('op','+')){this.i++;return this.unary()}return this.fracLine()}
  fracLine(){const a=this.power();if(!this.is('lfrac'))return a;this.i++;this.c.frac=1;const b=this.power();

/* ================= equations ================= */
function gauss(A){const n=A.length,M=A.map(r=>r.slice());let sc=0;M.forEach(r=>r.forEach(v=>sc=Math.max(sc,Math.abs(v))));const eps=1e-12*(sc||1);let rank=0;
  for(let c=0;c<n&&rank<n;c++){let p=rank;for(let i=rank+1;i<n;i++)if(Math.abs(M[i][c])>Math.abs(M[p][c]))p=i;if(Math.abs(M[p][c])<eps)continue;
    [M[p],M[rank]]=[M[rank],M[p]];const d=M[rank][c];for(let j=c;j<=n;j++)M[rank][j]/=d;
    for(let i=0;i<n;i++)if(i!==rank){const f=M[i][c];if(f)for(let j=c;j<=n;j++)M[i][j]-=f*M[rank][j]}rank++}
  if(rank<n){for(let i=rank;i<n;i++)if(Math.abs(M[i][n])>1e-9*(sc||1))return{none:true};return{inf:true}}
  return{sol:M.map(r=>tidy(r[n]))}}

  div:(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return[(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]}};
const pval=(c,x)=>c.reduce((s,k)=>s*x+k,0);
function quadRoots(a,b,c){let D=b*b-4*a*c;if(Math.abs(D)<1e-13*Math.max(b*b,Math.abs(4*a*c),1e-300))D=0;

  return z}
const eqn={kind:'sim',n:2,coef:[],ed:new Ed(),typing:false,r:0,c:0,phase:'edit',sol:[],page:0,

  on(){this.phase='edit';this.typing=false;this.ed.clear()},
  cols(){return this.coef[0].length},
  solve(){const L=['x','y','z','t'];
    if(this.kind==='sim'){const g=gauss(this.coef);if(g.none)this.sol=[['','No Solution']];else if(g.inf)this.sol=[['','Infinite Solution']];else this.sol=g.sol.map((v,i)=>[`<i>${L[i]}</i>=`,valHTML(v)])}

  key(a){

    const vis=this.kind==='sim'?Math.min(3,this.coef.length):1;let top=Math.max(0,Math.min(this.r-vis+1,this.coef.length-vis));if(this.r<top)top=this.r;

};

  return pdfjs})())}
async function mainThread(){await import(LIB.worker);pdfjs.GlobalWorkerOptions.workerPort=null;pdfjs.GlobalWorkerOptions.workerSrc=LIB.worker}
async function getDoc(data){
  const t=pdfjs.getDocument({data:data.slice(),isEvalSupported:false});
  const r=await Promise.race([t.promise,new Promise(res=>setTimeout(()=>res(null),12000))]);
  if(r)return r;
  try{t.destroy()}catch(e){}await mainThread();
  return pdfjs.getDocument({data:data.slice(),isEvalSupported:false}).promise}
let pdfLibP=null;
function loadPdfLib(){return pdfLibP||(pdfLibP=new Promise((res,rej)=>{if(window.PDFLib)return res(window.PDFLib);const s=document.createElement('script');s.src=LIB.lib;s.onload=()=>res(window.PDFLib);s.onerror=()=>rej(new Error('pdf-lib failed to load'));document.head.appendChild(s)}))}

/* ---- open / close ---- */
$('openpdf').addEventListener('click',()=>{fileIn.value='';fileIn.click()});
fileIn.addEventListener('change',()=>{const f=fileIn.files[0];if(f)openFile(f)});
document.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault()}});
document.addEventListener('drop',e=>{const f=[...(e.dataTransfer.files||[])].find(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));if(f){e.preventDefault();openFile(f)}});
async function openFile(f){
  if(st.doc&&st.dirty&&!await ask('Open a new PDF? Annotations on the current one that you have not downloaded will be lost.','Open new PDF'))return;
  enterWS();pagesEl.innerHTML='<div class="loading">Loading PDF…</div>';
  try{
    await loadPdfjs();
    const buf=new Uint8Array(await f.arrayBuffer());
    const doc=await getDoc(buf);
    closeDoc();st.doc=doc;st.bytes=buf;st.name=f.name||'document.pdf';st.zoom=1;
    pagesEl.innerHTML='';
    for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i),vp=page.getViewport({scale:1});
      const el=document.createElement('div');el.className='page';el.dataset.i=i-1;
      el.innerHTML='<canvas class="pdfc"></canvas><canvas class="ink"></canvas><div class="txt"></div><span class="pno">'+i+' / '+doc.numPages+'</span>';
      pagesEl.appendChild(el);
      const p={i:i-1,page,w:vp.width,h:vp.height,strokes:[],texts:[],el,pdfC:el.children[0],inkC:el.children[1],txt:el.children[2],near:false,rs:0,task:null};
      st.pages.push(p);io.observe(el)}
    layout();pagesEl.scrollTop=0;toast('Loaded '+st.name+' ('+doc.numPages+' page'+(doc.numPages>1?'s':'')+')');
  }catch(e){console.error(e);pagesEl.innerHTML='<div class="loading">Sorry, this PDF could not be opened.'+(/password/i.test(e&&e.name||'')?' It is password-protected.':'')+'</div>'}}
function closeDoc(){st.pages.forEach(p=>{io.unobserve(p.el);if(p.task)p.task.cancel()});st.pages=[];st.undo=[];st.redo=[];st.dirty=false;if(st.doc){st.doc.destroy();st.doc=null}}
function enterWS(){document.body.classList.add('ws','nocalc');fabState();refit()}
function fabState(){const shown=!document.body.classList.contains('nocalc'),f=$('fab'),l=shown?'Hide calculator':'Show calculator';f.setAttribute('aria-label',l);f.title=l;f.setAttribute('aria-expanded',String(shown))}
$('closepdf').addEventListener('click',async()=>{if(st.dirty&&!await ask('Close this PDF? Annotations that you have not downloaded will be lost.','Close PDF'))return;closeDoc();pagesEl.innerHTML='';document.body.classList.remove('ws','nocalc');refit()});
$('fab').addEventListener('click',()=>{document.body.classList.toggle('nocalc');fabState();refit()});
$('openpdf2').addEventListener('click',()=>{fileIn.value='';fileIn.click()});
function refit(){requestAnimationFrame(()=>{window.__calcFit&&window.__calcFit();layout()})}
function ask(msg,yes){return new Promise(r=>{$('dlgmsg').textContent=msg;$('dlgyes').textContent=yes;$('dlg').hidden=false;
  const done=v=>{$('dlg').hidden=true;$('dlgyes').onclick=$('dlgno').onclick=null;r(v)};$('dlgyes').onclick=()=>done(true);$('dlgno').onclick=()=>done(false)})}
addEventListener('beforeunload',e=>{if(st.dirty){e.preventDefault();e.returnValue=''}});

/* ---- layout & rendering ---- */
const DPR=()=>Math.min(window.devicePixelRatio||1,2);
const io=new IntersectionObserver(es=>{for(const en of es){const p=st.pages[+en.target.dataset.i];if(!p)continue;p.near=en.isIntersecting;if(p.near)activate(p);else release(p)}},{root:pagesEl,rootMargin:'900px 0px'});
function layout(){if(!st.pages.length)return;
  const avail=Math.max(200,pagesEl.clientWidth-28),maxW=Math.max(...st.pages.map(p=>p.w));
  const old=pagesEl.scrollHeight,ratio=old?pagesEl.scrollTop/old:0;
  st.S=avail/maxW*st.zoom;
  for(const p of st.pages){p.el.style.width=p.w*st.S+'px';p.el.style.height=p.h*st.S+'px';p.texts.forEach(t=>placeTB(p,t))}
  pagesEl.scrollTop=ratio*pagesEl.scrollHeight;
  $('zfit').textContent=Math.round(st.zoom*100)+'%';
  for(const p of st.pages)if(p.near)activate(p)}
let roT;new ResizeObserver(()=>{clearTimeout(roT);roT=setTimeout(layout,120)}).observe(pagesEl);
async function activate(p){const d=DPR(),W=Math.round(p.w*st.S*d),H=Math.round(p.h*st.S*d);
  if(p.inkC.width!==W||p.inkC.height!==H){p.inkC.width=W;p.inkC.height=H;drawInk(p)}
  if(p.rs===st.S*d)return;
  if(p.task){p.task.cancel();p.task=null}
  const scale=st.S*d,vp=p.page.getViewport({scale}),c=document.createElement('canvas');c.width=W;c.height=H;
  const task=p.page.render({canvasContext:c.getContext('2d'),canvas:c,viewport:vp});p.task=task;
  try{await task.promise}catch(e){return}
  if(p.task!==task)return;p.task=null;
  p.pdfC.width=W;p.pdfC.height=H;p.pdfC.getContext('2d').drawImage(c,0,0);c.width=c.height=0;p.rs=scale}
function release(p){if(p.task){p.task.cancel();p.task=null}p.pdfC.width=p.pdfC.height=1;p.inkC.width=p.inkC.height=1;p.rs=0}

/* ---- ink ---- */
function pathOf(ctx,pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  if(pts.length<3){for(const q of pts)ctx.lineTo(q[0],q[1]);if(pts.length===1)ctx.lineTo(pts[0][0]+.01,pts[0][1]);return}
  for(let k=1;k<pts.length-1;k++){const a=pts[k],b=pts[k+1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
  const l=pts[pts.length-1];ctx.lineTo(l[0],l[1])}
function drawInk(p,live){const c=p.inkC,ctx=c.getContext('2d');if(c.width<2)return;
  const k=c.width/p.w;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.setTransform(k,0,0,k,0,0);
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of live?[...p.strokes,live]:p.strokes){ctx.globalAlpha=s.t==='hl'?.38:1;ctx.globalCompositeOperation=s.t==='hl'?'multiply':'source-over';ctx.strokeStyle=s.c;ctx.lineWidth=s.w;pathOf(ctx,s.pts);ctx.stroke()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
const toPt=(p,e)=>{const r=p.el.getBoundingClientRect();return[(e.clientX-r.left)/r.width*p.w,(e.clientY-r.top)/r.height*p.h]};
let cur=null,raf=0;
const pageOf=t=>{const el=t.closest&&t.closest('.page');return el?st.pages[+el.dataset.i]:null};
pagesEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('.tbx'))return;const p=pageOf(e.target);if(!p)return;
  const penEraser=e.pointerType==='pen'&&(e.button===5||(e.buttons&32));
  const tool=penEraser?'eraser':st.tool;
  if(e.pointerType==='touch'&&!st.finger)return;
  if(tool==='hand'){if(e.pointerType==='mouse'){cur={pan:true,id:e.pointerId,y:e.clientY,x:e.clientX,st:pagesEl.scrollTop,sl:pagesEl.scrollLeft};pagesEl.setPointerCapture(e.pointerId)}return}
  if(tool==='text')return;
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.tbx'))document.activeElement.blur();
  e.preventDefault();pagesEl.setPointerCapture(e.pointerId);
  if(tool==='eraser'){cur={p,id:e.pointerId,erase:{k:'erase',p:p.i,items:[]}};eraseAt(p,toPt(p,e));return}
  cur={p,id:e.pointerId,s:{t:tool,c:st[tool].c,w:st[tool].w,pts:[toPt(p,e)]}};drawInk(p,cur.s)});
pagesEl.addEventListener('pointermove',e=>{if(!cur||e.pointerId!==cur.id)return;
  if(cur.pan){pagesEl.scrollTop=cur.st-(e.clientY-cur.y);pagesEl.scrollLeft=cur.sl-(e.clientX-cur.x);return}
  e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e],p=cur.p;
  for(const ev of evs.length?evs:[e]){const q=toPt(p,ev);
    if(cur.erase){eraseAt(p,q);continue}
    const l=cur.s.pts[cur.s.pts.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])*st.S>=1)cur.s.pts.push(q)}
  if(cur.s&&!raf)raf=requestAnimationFrame(()=>{raf=0;if(cur&&cur.s)drawInk(cur.p,cur.s)})});
function endStroke(e){if(!cur||e.pointerId!==cur.id)return;const c=cur;cur=null;
  if(c.pan)return;
  if(c.erase){if(c.erase.items.length)push(c.erase);return}
  c.s.pts=c.s.pts.map(q=>[+q[0].toFixed(2),+q[1].toFixed(2)]);c.p.strokes.push(c.s);push({k:'add',p:c.p.i,s:c.s});drawInk(c.p)}
pagesEl.addEventListener('pointerup',endStroke);pagesEl.addEventListener('pointercancel',endStroke);
function segDist(q,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((q[0]-a[0])*dx+(q[1]-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(q[0]-a[0]-t*dx,q[1]-a[1]-t*dy)}
function eraseAt(p,q){const r=st.eraser.w/2/st.S;let hit=false;
  for(let i=p.strokes.length-1;i>=0;i--){const s=p.strokes[i],pts=s.pts,lim=r+s.w/2;let h=false;
    for(let k=0;k<pts.length&&!h;k++)h=segDist(q,pts[k],pts[Math.min(k+1,pts.length-1)])<=lim;
    if(h){cur.erase.items.push({s,idx:i});p.strokes.splice(i,1);hit=true}}
  if(hit)drawInk(p)}
/* Apple Pencil: stop the page from scrolling while the pencil (or a drawing finger) is on it */
const drawsTouch=e=>{if(e.target.closest&&e.target.closest('.tbx'))return false;if(st.tool==='hand'||st.tool==='text')return false;return st.finger||[...e.touches].some(t=>t.touchType==='stylus')};
pagesEl.addEventListener('touchstart',e=>{if(drawsTouch(e))e.preventDefault()},{passive:false});
pagesEl.addEventListener('touchmove',e=>{if(cur&&!cur.pan||drawsTouch(e))e.preventDefault()},{passive:false});

/* ---- text boxes ---- */
const PADX=.25,PADY=.15,BASE=.93;
pagesEl.addEventListener('click',e=>{if(st.tool!=='text'||e.target.closest('.tbx'))return;const p=pageOf(e.target);if(!p)return;
  const q=toPt(p,e),t={x:q[0],y:q[1]-st.text.w*.75,text:'',size:st.text.w,c:st.text.c};p.texts.push(t);makeTB(p,t,true);push({k:'tadd',p:p.i,t})});
function placeTB(p,t){const d=t.el;if(!d)return;d.style.left=t.x*st.S+'px';d.style.top=t.y*st.S+'px';d.style.fontSize=t.size*st.S+'px';d.style.color=t.c}
function makeTB(p,t,focus){const d=document.createElement('div');d.className='tbx';
  d.innerHTML='<span class="grip" title="Drag to move" role="button" aria-label="Move text"></span><div class="ed" contenteditable="true" spellcheck="false"></div><button class="del" title="Delete text" aria-label="Delete text">×</button>';
  const ed=d.querySelector('.ed');ed.textContent=t.text;t.el=d;p.txt.appendChild(d);placeTB(p,t);
  ed.addEventListener('input',()=>{t.text=ed.innerText.replace(/\n$/,'');st.dirty=true});
  ed.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
  ed.addEventListener('blur',()=>setTimeout(()=>{if(!t.text.trim()&&!d.contains(document.activeElement)&&d.isConnected){d.remove();t.el=null;const i=p.texts.indexOf(t);if(i>=0)p.texts.splice(i,1);st.undo=st.undo.filter(o=>o.t!==t)}},150));
  d.querySelector('.del').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const i=p.texts.indexOf(t);if(i>=0){p.texts.splice(i,1);d.remove();t.el=null;if(t.text.trim())push({k:'tdel',p:p.i,t})}});
  const g=d.querySelector('.grip');
  g.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();g.setPointerCapture(e.pointerId);d.classList.add('drag');
    const sx=e.clientX,sy=e.clientY,ox=t.x,oy=t.y;
    const mv=ev=>{t.x=ox+(ev.clientX-sx)/st.S;t.y=oy+(ev.clientY-sy)/st.S;placeTB(p,t)};
    const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);d.classList.remove('drag');if(t.x!==ox||t.y!==oy)push({k:'tmove',p:p.i,t,from:[ox,oy],to:[t.x,t.y]});ed.focus()};
    g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)});
  if(focus)ed.focus()}

/* ---- undo / redo ---- */
function push(op){st.undo.push(op);if(st.undo.length>300)st.undo.shift();st.redo=[];st.dirty=true;btnState()}
function apply(op,back){const p=st.pages[op.p];
  switch(op.k){
    case 'add':if(back)p.strokes.splice(p.strokes.lastIndexOf(op.s),1);else p.strokes.push(op.s);break;
    case 'erase':if(back)[...op.items].reverse().forEach(it=>p.strokes.splice(it.idx,0,it.s));else op.items.forEach(it=>{const i=p.strokes.indexOf(it.s);if(i>=0)p.strokes.splice(i,1)});break;
    case 'tadd':case 'tdel':{const add=(op.k==='tadd')!==back;if(add){p.texts.push(op.t);makeTB(p,op.t)}else{const i=p.texts.indexOf(op.t);if(i>=0)p.texts.splice(i,1);if(op.t.el){op.t.el.remove();op.t.el=null}}break}
    case 'tmove':[op.t.x,op.t.y]=back?op.from:op.to;placeTB(p,op.t);break}
  drawInk(p)}
function undo(){const op=st.undo.pop();if(!op)return;apply(op,true);st.redo.push(op);st.dirty=true;btnState()}
function redo(){const op=st.redo.pop();if(!op)return;apply(op,false);st.undo.push(op);st.dirty=true;btnState()}
$('undo').addEventListener('click',undo);$('redo').addEventListener('click',redo);
function btnState(){$('undo').disabled=!st.undo.length;$('redo').disabled=!st.redo.length}
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('ws'))return;if(e.target.closest&&e.target.closest('[contenteditable],input,textarea'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.stopImmediatePropagation();e.shiftKey?redo():undo()}},true);

/* ---- toolbar ---- */
function setTool(t){st.tool=t;pagesEl.className='tool-'+t+(st.finger&&!['hand','text'].includes(t)?' fingerdraw':'');
  tb.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));renderOpts()}
function renderOpts(){const t=st.tool,C=COLORS[t],W=WIDTHS[t];
  $('colors').innerHTML=C?C.map(c=>`<button class="sw${st[t].c===c?' on':''}" data-c="${c}" title="Colour" aria-label="Colour ${c}"><i style="background:${c}"></i></button>`).join(''):'';
  $('widths').innerHTML=W?W.map((w,i)=>{const px=t==='text'?null:[6,10,15][i];return `<button class="wd${st[t].w===w?' on':''}" data-w="${w}" title="${t==='text'?'Text size '+w:'Size'}" aria-label="Size ${i+1}">${t==='text'?`<span style="font-size:${[12,15,19][i]}px">A</span>`:`<i style="width:${px}px;height:${px}px"></i>`}</button>`}).join(''):''}
tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tool)setTool(b.dataset.tool);
  else if(b.dataset.c){st[st.tool].c=b.dataset.c;renderOpts();const a=document.activeElement;if(st.tool==='text'&&a&&a.closest&&a.closest('.tbx'))recolorActive()}
  else if(b.dataset.w){st[st.tool].w=+b.dataset.w;renderOpts()}});
tb.addEventListener('pointerdown',e=>{if(e.target.closest('[data-c]'))e.preventDefault()});
function recolorActive(){for(const p of st.pages)for(const t of p.texts)if(t.el&&t.el.contains(document.activeElement)){t.c=st.text.c;placeTB(p,t);st.dirty=true}}
$('finger').addEventListener('click',()=>{st.finger=!st.finger;$('finger').setAttribute('aria-pressed',String(st.finger));setTool(st.tool);toast(st.finger?'Fingers now draw. Use the scroll bar or Scroll tool to move.':'Fingers scroll; Apple Pencil draws.')});
const zoomTo=z=>{st.zoom=Math.max(.5,Math.min(3,Math.round(z*100)/100));layout()};
$('zin').addEventListener('click',()=>zoomTo(st.zoom+.25));$('zout').addEventListener('click',()=>zoomTo(st.zoom-.25));$('zfit').addEventListener('click',()=>zoomTo(1));
setTool('pen');btnState();

/* ---- export ---- */
const hex=(h,rgb)=>rgb(parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255);
$('dl').addEventListener('click',async()=>{if(!st.doc)return;const btn=$('dl');btn.disabled=true;toast('Preparing your PDF…');
  try{
    const L=await loadPdfLib(),{PDFDocument,StandardFonts,LineCapStyle,degrees,rgb,BlendMode}=L;
    const doc=await PDFDocument.load(st.bytes,{ignoreEncryption:true}),font=await doc.embedFont(StandardFonts.Helvetica),pages=doc.getPages();
    const clean=s=>[...s].map(ch=>{try{font.widthOfTextAtSize(ch,10);return ch}catch(e){return '?'}}).join('');
    let lost=false;
    st.pages.forEach((p,i)=>{const pg=pages[i];if(!pg||(!p.strokes.length&&!p.texts.length))return;
      const r=((pg.getRotation().angle%360)+360)%360,cb=pg.getCropBox(),W=cb.width,H=cb.height,ox=cb.x,oy=cb.y;
      const map=(dx,dy)=>{let X,Y;if(r===90){X=dy;Y=dx}else if(r===180){X=W-dx;Y=dy}else if(r===270){X=W-dy;Y=H-dx}else{X=dx;Y=H-dy}return[X+ox,Y+oy]};
      for(const s of p.strokes){const pts=s.pts.length===1?[s.pts[0],[s.pts[0][0]+.01,s.pts[0][1]]]:s.pts;
        const d=pts.map((q,k)=>{const[X,Y]=map(q[0],q[1]);return(k?'L':'M')+X.toFixed(2)+' '+(-Y).toFixed(2)}).join(' ');
        const o={x:0,y:0,borderColor:hex(s.c,rgb),borderWidth:s.w,borderLineCap:LineCapStyle.Round};
        if(s.t==='hl'){o.borderOpacity=.38;if(BlendMode)o.blendMode=BlendMode.Multiply}
        pg.drawSvgPath(d,o)}
      for(const t of p.texts){if(!t.text.trim())continue;t.text.split('\n').forEach((ln,k)=>{const c=clean(ln);if(c!==ln)lost=true;
        const[X,Y]=map(t.x+PADX*t.size,t.y+t.size*(PADY+BASE+k*1.25));pg.drawText(c,{x:X,y:Y,size:t.size,font,color:hex(t.c,rgb),rotate:degrees(r)})})}});
    const out=await doc.save(),name=st.name.replace(/\.pdf$/i,'')+' (annotated).pdf',blob=new Blob([out],{type:'application/pdf'});
    const dl=await dlP;
    if(dl){try{await dl.save({filename:name,data:blob});st.dirty=false;toast('Downloaded '+name)}catch(err){toast(err&&err.code==='declined'?'Download cancelled.':err&&err.code==='host_unavailable'?'This app cannot save files. Open the page in a browser to download.':'Could not download: '+((err&&(err.message||err.code))||'unknown error'))}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);st.dirty=false;toast('Downloaded '+name)}
    if(lost)toast('Some symbols in text boxes (e.g. √, π) are not in the PDF font and were saved as "?". Use the pen for those.');
  }catch(e){console.error(e);toast('Sorry, the PDF could not be saved.')}
  finally{btn.disabled=false}});
window.__pdfState=st;
}
</script>

</body>
